name: ci

on:
  push:
    branches: [master, feature/**, fix/**]
  pull_request:
    branches: [master]

# Two-job split instead of one monolithic job. Why:
#   - `analyze + test` runs in <4 min and gives the PR-author the same
#     signal they would see locally with `flutter analyze && flutter test`.
#   - `android-build` runs in parallel and gates the merge. It compiles
#     the full Gradle project, which is the place where plugin SDK floor
#     mismatches (file_picker 11, geocoding 3.0, etc.) surface. Catching
#     them here is far cheaper than waiting for a release smoke test.
#   - `ios-build` runs only on master / feature-branch pushes (not PRs)
#     because iOS builds need a macOS runner and spend ~10 min.
jobs:
  analyze-test:
    name: analyze · test · layering
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Materialize a stub `lib/firebase_options.dart` so `flutter analyze`
      # can resolve the import in `lib/core/services/firebase_bootstrap.dart`.
      #
      # The real file is produced locally by `flutterfire configure` and is
      # gitignored (it contains platform API keys). CI never talks to Firebase,
      # so we don't need real options — `Firebase.initializeApp` will throw on
      # these placeholder values, which `FirebaseBootstrap.start()` already
      # catches and logs (the app then runs in offline-only mode).
      - name: Write firebase_options stub
        run: |
          cat > lib/firebase_options.dart <<'EOF'
          // GENERATED FOR CI ONLY.
          //
          // The real `lib/firebase_options.dart` is produced by
          // `flutterfire configure` and contains platform-specific API keys;
          // it is gitignored. CI never authenticates against Firebase, so we
          // ship a no-op stub that satisfies the static analyzer.
          //
          // Do not commit this file from a developer machine.
          import 'package:firebase_core/firebase_core.dart';

          class DefaultFirebaseOptions {
            static const FirebaseOptions currentPlatform = FirebaseOptions(
              apiKey: 'ci-stub-api-key',
              appId: '1:0000000000:android:0000000000000000',
              messagingSenderId: '0000000000',
              projectId: 'cat-care-ci-stub',
            );
          }
          EOF

      - name: Static analysis
        run: flutter analyze --no-pub

      - name: Unit + widget tests
        run: flutter test --no-pub --coverage

      - name: Architectural layering guard
        # Defends docs/architecture.md "UI never imports Firebase directly".
        # Mirrors the assertion in test/app_smoke_test.dart's layering group so
        # the rule holds even when test files are skipped.
        run: dart run tools/check_layering.dart

      - name: Native plugin SDK-floor guard
        # Defends against the file_picker 11 / geocoding 3.0 class of failure
        # where a plugin's android/build.gradle pins compileSdk < 34 but its
        # AndroidX transitive deps require >= 34. Fails fast in plain Dart
        # with a 1-line message per offender instead of a Gradle stack trace.
        run: dart run tools/check_native_plugin_sdk_floor.dart

  android-build:
    name: build · android (debug apks built against compileSdk 36)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
          cache: true

      # Pin the Android SDK platforms/build-tools so AGP 8.1.1 can resolve
      # `compileSdk = 36` (see android/build.gradle.kts). Without this,
      # Gradle silently auto-downloads the SDK but the resolution can race
      # with the plugin order and produce a "SDK location not found" error
      # on cold-cache runs.
      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 36 + build-tools
        run: |
          yes | sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android debug APK
        # This is the smoke build that catches plugin-AGP / Kotlin / SDK
        # collisions before push. `--no-pub` is intentional: it uses the
        # lockfile produced by `flutter pub get` above.
        run: flutter build apk --debug --no-pub

  ios-build:
    name: build · ios (debug, no codesign)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/feature/'))
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS debug (no codesign)
        run: flutter build ios --debug --no-codesign --no-pub
        env:
          IMAGE_PLACEHOLDER: '1'
