name: cat_care
description: "CatCare BD — a personal digital companion for cat owners in Bangladesh."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Cross-platform UI / state / navigation
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.6.2

  # Networking + logging + image cache
  dio: ^5.7.0
  logger: ^2.4.0
  cached_network_image: ^3.4.1

  # Firebase (cross-platform)
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  firebase_crashlytics: ^4.3.4
  firebase_messaging: ^15.2.4

  # Local notifications + timezone (cross-platform)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^4.1.0

  # Cross-platform permissions / files / utils
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  path: ^1.9.0
  uuid: ^4.5.1
  intl: ^0.20.1

  # Maps + location
  google_maps_flutter: ^2.12.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  connectivity_plus: ^6.1.0

  # Theming + image analysis
  palette_generator: ^0.3.3+5
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  go_router_builder: ^2.7.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env.example
    - assets/images/
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
